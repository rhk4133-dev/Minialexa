
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My 3D Character</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #101116;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
  border-bottom: 1px solid #292b32;
}

#status {
  text-align: center;
  color: #aaa;
  padding: 10px;
  font-size: 13px;
}

#viewer {
  width: 100%;
  height: calc(100dvh - 245px);
  min-height: 250px;
  touch-action: none;
}

#viewer canvas {
  display: block;
}

.panel {
  height: 180px;
  padding: 12px;
  background: #191a20;
  border-top: 1px solid #333;
}

.heading {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 10px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  justify-content: center;
}

button {
  background: #292b34;
  color: white;
  border: 1px solid #454751;
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 13px;
  cursor: pointer;
}

button:active {
  background: #ff8a00;
}

#animations {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 10px;
}

#animations button {
  flex-shrink: 0;
}

#animations button.active {
  background: #ff8a00;
  color: black;
}

</style>
</head>

<body>

<header>MY 3D CHARACTER</header>

<div id="status">Loading man.glb...</div>

<div id="viewer"></div>

<div class="panel">

  <div class="heading">CHARACTER ANIMATIONS</div>

  <div id="animations">
    <button disabled>No animations loaded</button>
  </div>

  <br>

  <div class="heading">CHARACTER CONTROLS</div>

  <div class="buttons">
    <button onclick="rotateLeft()">↶ Rotate</button>
    <button onclick="rotateRight()">Rotate ↷</button>
    <button onclick="zoomIn()">Zoom +</button>
    <button onclick="zoomOut()">Zoom -</button>
    <button onclick="resetCamera()">Reset</button>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"three/addons/loaders/GLTFLoader.js";

import { OrbitControls } from
"three/addons/controls/OrbitControls.js";

// SCENE

const viewer = document.getElementById("viewer");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x101116);

// CAMERA

const camera = new THREE.PerspectiveCamera(
  40,
  viewer.clientWidth / viewer.clientHeight,
  0.1,
  1000
);

camera.position.set(0, 1.5, 4);

// RENDERER

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  viewer.clientWidth,
  viewer.clientHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

viewer.appendChild(renderer.domElement);

// CONTROLS

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.target.set(0, 1, 0);
controls.minDistance = 1;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI / 2;

// LIGHTING

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x333344,
  2
);

scene.add(ambient);

const mainLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

mainLight.position.set(3, 6, 5);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(
  0xffffff,
  1
);

fillLight.position.set(-4, 3, -3);
scene.add(fillLight);

// FLOOR

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5, 64),
  new THREE.MeshStandardMaterial({
    color: 0x202127,
    roughness: 0.9
  })
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;

scene.add(floor);

// CHARACTER

let character = null;
let mixer = null;
let actions = [];
let activeAction = null;

const loader = new GLTFLoader();

loader.load(
  "./man.glb",

  function(gltf) {

    character = gltf.scene;

    scene.add(character);

    // CENTER AND FIT CHARACTER

    const box = new THREE.Box3().setFromObject(character);

    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    character.position.x -= center.x;
    character.position.z -= center.z;
    character.position.y -= box.min.y;

    const maxDimension = Math.max(
      size.x,
      size.y,
      size.z
    );

    const fitDistance = maxDimension * 2.2;

    camera.position.set(
      0,
      maxDimension * 0.8,
      fitDistance
    );

    controls.target.set(
      0,
      size.y * 0.5,
      0
    );

    controls.update();

    // ANIMATIONS

    if (gltf.animations.length > 0) {

      mixer = new THREE.AnimationMixer(character);

      actions = gltf.animations.map((clip) => {

        return mixer.clipAction(clip);

      });

      createAnimationButtons(gltf.animations);

      playAnimation(0);

    } else {

      document.getElementById("animations").innerHTML =
        "<button disabled>No animation clips in GLB</button>";

    }

    document.getElementById("status").textContent =
      "YOUR CHARACTER IS READY";

  },

  function(xhr) {

    if (xhr.total > 0) {

      const percent = Math.round(
        xhr.loaded / xhr.total * 100
      );

      document.getElementById("status").textContent =
        "Loading character " + percent + "%";

    }

  },

  function(error) {

    console.error(error);

    document.getElementById("status").textContent =
      "ERROR: Could not load man.glb. Check file location.";

  }

);

// CREATE ANIMATION BUTTONS

function createAnimationButtons(clips) {

  const container = document.getElementById("animations");

  container.innerHTML = "";

  clips.forEach((clip, index) => {

    const button = document.createElement("button");

    button.textContent = clip.name || "Animation " + (index + 1);

    button.onclick = () => playAnimation(index);

    button.id = "animation-" + index;

    container.appendChild(button);

  });

}

// PLAY ANIMATION

window.playAnimation = function(index) {

  if (!actions[index]) return;

  const nextAction = actions[index];

  if (activeAction === nextAction) return;

  nextAction.reset();
  nextAction.play();

  if (activeAction) {

    activeAction.crossFadeTo(
      nextAction,
      0.3,
      true
    );

  }

  activeAction = nextAction;

  document.querySelectorAll("#animations button")
    .forEach(button => button.classList.remove("active"));

  const selected = document.getElementById(
    "animation-" + index
  );

  if (selected) selected.classList.add("active");

};

// ROTATION

window.rotateLeft = function() {

  if (character) character.rotation.y += 0.4;

};

window.rotateRight = function() {

  if (character) character.rotation.y -= 0.4;

};

// ZOOM

window.zoomIn = function() {

  camera.position.multiplyScalar(0.85);

  controls.update();

};

window.zoomOut = function() {

  camera.position.multiplyScalar(1.15);

  controls.update();

};

// RESET

window.resetCamera = function() {

  if (!character) return;

  character.rotation.set(0, 0, 0);

  const box = new THREE.Box3().setFromObject(character);
  const size = box.getSize(new THREE.Vector3());

  camera.position.set(0, size.y * 0.8, size.y * 2.2);

  controls.target.set(0, size.y * 0.5, 0);

  controls.update();

};

// ANIMATION LOOP

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  if (mixer) mixer.update(delta);

  controls.update();

  renderer.render(scene, camera);

}

animate();

// RESPONSIVE

const resizeObserver = new ResizeObserver(() => {

  const width = viewer.clientWidth;
  const height = viewer.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

});

resizeObserver.observe(viewer);

</script>

</body>
</html>
